<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armut Pen v5.1 Studio</title>
    <!-- JSZip & FileSaver Kütüphaneleri -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #d4d4d4; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { background-color: #252526; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3c3c3c; height: 45px; }
        .logo { font-weight: bold; font-size: 16px; color: #a6e22e; display: flex; align-items: center; gap: 8px; }
        .actions { display: flex; gap: 6px; align-items: center; }
        input[type="text"], input[type="password"], select { background-color: #3c3c3c; border: 1px solid #555; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; outline: none; }
        button { background-color: #0e639c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; transition: background 0.2s; }
        button:hover { background-color: #1177bb; }
        button.secondary { background-color: #3c3c3c; }
        button.secondary:hover { background-color: #505050; }
        button.success { background-color: #28a745; }
        button.success:hover { background-color: #218838; }

        .workspace { display: flex; flex: 1; height: calc(100vh - 45px); }
        
        /* Sol Dosya Ağacı (Sidebar) */
        #sidebar { width: 240px; background-color: #252526; border-right: 1px solid #3c3c3c; display: flex; flex-direction: column; }
        .sidebar-header { padding: 8px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: #888; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .tree-actions { display: flex; gap: 4px; }
        .file-tree { flex: 1; overflow-y: auto; padding: 5px 0; }
        
        .tree-item { padding: 5px 10px; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; color: #cccccc; user-select: none; }
        .tree-item:hover { background-color: #2a2d2e; }
        .tree-item.active { background-color: #37373d; color: #fff; border-left: 3px solid #0e639c; }
        .tree-item.folder { font-weight: bold; color: #e8a838; }
        .tree-item .del-btn { display: none; color: #ff5555; font-size: 11px; font-weight: bold; }
        .tree-item:hover .del-btn { display: inline; }
        .tree-item .add-file-btn { display: none; color: #a6e22e; font-size: 11px; font-weight: bold; margin-right: 6px; }
        .tree-item.folder:hover .add-file-btn { display: inline; }
        .folder-children { padding-left: 15px; }

        /* Editör Paneli */
        #editor-panel { flex: 1.2; display: flex; flex-direction: column; border-right: 1px solid #3c3c3c; }
        .tabs { background-color: #2d2d2d; display: flex; overflow-x: auto; border-bottom: 1px solid #3c3c3c; }
        .tab { padding: 6px 14px; font-size: 12px; background: #2d2d2d; color: #969696; border-right: 1px solid #252526; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .tab.active { background: #1e1e1e; color: #fff; border-top: 2px solid #0e639c; }
        #editor-container { flex: 1; height: 100%; min-height: 200px; }

        /* Önizleme Paneli */
        #preview-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #3c3c3c; background: white; position: relative; }
        .panel-header { background-color: #2d2d2d; padding: 6px 12px; font-size: 12px; font-weight: bold; color: #aaa; border-bottom: 1px solid #3c3c3c; display: flex; justify-content: space-between; align-items: center; }
        iframe { flex: 1; width: 100%; height: 100%; border: none; background: #fff; }

        /* Tam Ekran Modal */
        #fullscreen-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 99999; flex-direction: column; }
        #fullscreen-modal.active { display: flex; }
        #fullscreen-modal .fs-header { background: #252526; padding: 10px 15px; display: flex; justify-content: space-between; color: white; align-items: center; }

        /* AI Asistan Panel */
        #ai-panel { width: 320px; background-color: #252526; display: flex; flex-direction: column; }
        .chat-history { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 8px 12px; border-radius: 6px; font-size: 12px; max-width: 95%; line-height: 1.4; word-wrap: break-word; }
        .message.user { background-color: #0e639c; color: white; align-self: flex-end; }
        .message.ai { background-color: #333333; color: #d4d4d4; align-self: flex-start; border: 1px solid #444; }
        
        .chat-input-area { padding: 8px; background-color: #1e1e1e; border-top: 1px solid #3c3c3c; display: flex; flex-direction: column; gap: 6px; }
        .ref-file-box { font-size: 11px; color: #a6e22e; display: flex; align-items: center; justify-content: space-between; background: #252526; padding: 4px 8px; border-radius: 4px; display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            🍐 Armut Pen <span style="font-size: 10px; background: #3c3c3c; color: #a6e22e; padding: 2px 6px; border-radius: 4px;">v5.1 Studio</span>
        </div>
        <div class="actions">
            <input type="password" id="apiKeyInput" placeholder="Gemini API Key...">
            <button class="secondary" onclick="saveApiKey()">Key Kaydet</button>
            <button class="success" onclick="downloadProjectZip()">📦 Cihaza İndir (.ZIP)</button>
            <button onclick="runPreview()">🔄 Yenile</button>
        </div>
    </header>

    <div class="workspace">
        <!-- SOL SIDEBAR: DOSYA KONTROLÜ -->
        <div id="sidebar">
            <div class="sidebar-header">
                <span>GEZGİN</span>
                <div class="tree-actions">
                    <button style="padding:2px 5px; font-size:10px;" onclick="createNewFolder()">+ Klasör</button>
                    <button style="padding:2px 5px; font-size:10px;" onclick="createNewFileRoot()">+ Dosya</button>
                </div>
            </div>
            <div class="file-tree" id="fileTree"></div>
        </div>

        <!-- ORTA PANEL: EDİTÖR -->
        <div id="editor-panel">
            <div class="tabs" id="tabsHeader"></div>
            <div id="editor-container"></div>
        </div>

        <!-- SAĞ PANEL: ÖNİZLEME -->
        <div id="preview-panel">
            <div class="panel-header" style="color: #ddd;">
                <span>Canlı Önizleme</span>
                <button class="secondary" style="font-size: 11px;" onclick="toggleFullScreen(true)">⛶ Tam Ekran Gör</button>
            </div>
            <iframe id="preview-frame"></iframe>
        </div>

        <!-- SAĞ PANEL: AI ASİSTAN -->
        <div id="ai-panel">
            <div class="panel-header">🤖 Nambır AI Studio</div>
            <div class="chat-history" id="chatHistory">
                <div class="message ai">
                    Selam Taha kanka! <b>Nambır AI v5.1</b> hazır. İster kod sor, ister klasörlerindeki dosyaları **referans gösterip** geliştirme yapalım! 🚀
                </div>
            </div>
            <div class="chat-input-area">
                <div id="refFileBox" class="ref-file-box">
                    <span id="refFileName">📄 Referans: Yok</span>
                    <span style="cursor:pointer; color:#ff5555;" onclick="clearReference()">✖</span>
                </div>
                <div style="display:flex; gap:4px;">
                    <select id="refSelect" style="flex:1;" onchange="setReferenceFile(this.value)">
                        <option value="">📎 AI'ya Referans Dosya Bağla...</option>
                    </select>
                </div>
                <div style="display:flex; gap:4px;">
                    <input type="text" id="userInput" placeholder="Nambır AI'ya sor..." onkeydown="if(event.key==='Enter') sendMessage()">
                    <button onclick="sendMessage()">Gönder</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TAM EKRAN PREVIEW MODAL -->
    <div id="fullscreen-modal">
        <div class="fs-header">
            <span>🌐 Canlı Tam Ekran Önizleme</span>
            <button class="secondary" onclick="toggleFullScreen(false)">❌ Kapat</button>
        </div>
        <iframe id="fs-preview-frame"></iframe>
    </div>

    <script>
        // Dil Haritası
        const languageMap = {
            'html': 'html', 'css': 'css', 'js': 'javascript', 'json': 'json',
            'py': 'python', 'cpp': 'cpp', 'c': 'cpp', 'cs': 'csharp',
            'java': 'java', 'php': 'php', 'ts': 'typescript', 'sql': 'sql',
            'rb': 'ruby', 'go': 'go', 'md': 'markdown'
        };

        // Varsayılan Dosya & Klasör Yapısı
        let fileStructure = {
            "folders": {
                "src": ["script.js", "style.css"]
            },
            "files": {
                "index.html": {
                    language: "html",
                    content: `<!DOCTYPE html>\n<html>\n<head>\n  <link rel="stylesheet" href="src/style.css">\n</head>\n<body>\n  <h1>🍐 Armut Pen v5.1 Studio!</h1>\n  <p>Klasör ve Dosya Ağacı Sorunsuz Çalışıyor.</p>\n  <button onclick="selamVer()">Tıkla</button>\n  <script src="src/script.js"><\/script>\n</body>\n</html>`
                },
                "src/style.css": {
                    language: "css",
                    content: `body { background: #111827; color: #8bc34a; font-family: sans-serif; text-align: center; padding-top: 50px; }\nbutton { padding: 10px 20px; background: #0e639c; color: white; border: none; border-radius: 5px; cursor: pointer; }`
                },
                "src/script.js": {
                    language: "javascript",
                    content: `function selamVer() {\n  alert("Armut Pen v5.1 Sistemleri Aktif!");\n}`
                }
            }
        };

        let activeFile = "index.html";
        let referenceFile = null;
        let editor = null;

        // BÜTÜN BUTONLAR İÇİN KESİN ÇALIŞAN TETİKLEYİCİLER
        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;

            const savedStruct = localStorage.getItem('armut_v5_struct');
            if (savedStruct) {
                try { fileStructure = JSON.parse(savedStruct); } catch(e){}
            }

            initMonaco();
            updateFileTree();
            updateRefSelect();
        };

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API Key kaydedildi kanka!');
            } else {
                alert('Lütfen geçerli bir Key girin!');
            }
        }

        function initMonaco() {
            require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
            require(['vs/editor/editor.main'], function() {
                const fileData = fileStructure.files[activeFile] || { content: "", language: "html" };
                editor = monaco.editor.create(document.getElementById('editor-container'), {
                    value: fileData.content,
                    language: fileData.language,
                    theme: 'vs-dark',
                    automaticLayout: true,
                    fontSize: 13,
                    minimap: { enabled: false }
                });

                editor.onDidChangeModelContent(() => {
                    if (fileStructure.files[activeFile]) {
                        fileStructure.files[activeFile].content = editor.getValue();
                        localStorage.setItem('armut_v5_struct', JSON.stringify(fileStructure));
                        runPreview();
                    }
                });

                renderTabs();
                runPreview();
            });
        }

        function openFile(filepath) {
            if (!fileStructure.files[filepath]) return;
            if (editor) {
                if(fileStructure.files[activeFile]) {
                    fileStructure.files[activeFile].content = editor.getValue();
                }
                activeFile = filepath;
                const ext = filepath.split('.').pop().toLowerCase();
                const lang = languageMap[ext] || 'plaintext';

                monaco.editor.setModelLanguage(editor.getModel(), lang);
                editor.setValue(fileStructure.files[filepath].content);
            }
            renderTabs();
            updateFileTree();
        }

        // KLASÖR VE DOSYA OLUŞTURMA İŞLEMLERİ
        function createNewFolder() {
            const folderName = prompt("Yeni Klasör Adı:");
            if (!folderName) return;
            if (fileStructure.folders[folderName]) { alert("Bu klasör zaten var!"); return; }
            fileStructure.folders[folderName] = [];
            saveAndRefresh();
        }

        function createNewFileRoot() {
            const fileName = prompt("Kök Dizine Dosya Adı (Örn: app.py, style.css):");
            if (!fileName) return;
            addFileToSystem(fileName);
        }

        function createNewFileInFolder(folderName, e) {
            e.stopPropagation();
            const fileName = prompt(`[${folderName}] Klasörü İçine Dosya Adı (Örn: script.js):`);
            if (!fileName) return;
            const fullPath = `${folderName}/${fileName}`;
            fileStructure.folders[folderName].push(fullPath);
            addFileToSystem(fullPath);
        }

        function addFileToSystem(filepath) {
            if (fileStructure.files[filepath]) { alert("Bu dosya zaten mevcut!"); return; }
            const ext = filepath.split('.').pop().toLowerCase();
            const lang = languageMap[ext] || 'plaintext';
            fileStructure.files[filepath] = { language: lang, content: "" };
            openFile(filepath);
            saveAndRefresh();
        }

        function deleteItem(path, isFolder, e) {
            e.stopPropagation();
            if (confirm(`${path} silinsin mi?`)) {
                if (isFolder) {
                    (fileStructure.folders[path] || []).forEach(f => delete fileStructure.files[f]);
                    delete fileStructure.folders[path];
                } else {
                    delete fileStructure.files[path];
                    Object.keys(fileStructure.folders).forEach(fol => {
                        fileStructure.folders[fol] = fileStructure.folders[fol].filter(x => x !== path);
                    });
                }
                const remainingFiles = Object.keys(fileStructure.files);
                if (remainingFiles.length > 0) activeFile = remainingFiles[0];
                saveAndRefresh();
                if (remainingFiles.length > 0) openFile(activeFile);
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('armut_v5_struct', JSON.stringify(fileStructure));
            updateFileTree();
            updateRefSelect();
        }

        function updateFileTree() {
            const tree = document.getElementById('fileTree');
            tree.innerHTML = '';

            // Klasörleri Çiz
            Object.keys(fileStructure.folders).forEach(folder => {
                const fItem = document.createElement('div');
                fItem.className = 'tree-item folder';
                fItem.innerHTML = `
                    <span>📁 ${folder}</span>
                    <div>
                        <span class="add-file-btn" onclick="createNewFileInFolder('${folder}', event)">+ Dosya</span>
                        <span class="del-btn" onclick="deleteItem('${folder}', true, event)">✖</span>
                    </div>
                `;
                tree.appendChild(fItem);

                const childBox = document.createElement('div');
                childBox.className = 'folder-children';
                (fileStructure.folders[folder] || []).forEach(childPath => {
                    const cItem = document.createElement('div');
                    cItem.className = `tree-item ${childPath === activeFile ? 'active' : ''}`;
                    cItem.onclick = () => openFile(childPath);
                    cItem.innerHTML = `
                        <span>📄 ${childPath.split('/').pop()}</span>
                        <span class="del-btn" onclick="deleteItem('${childPath}', false, event)">✖</span>
                    `;
                    childBox.appendChild(cItem);
                });
                tree.appendChild(childBox);
            });

            // Kök Dizindeki Dosyaları Çiz
            Object.keys(fileStructure.files).forEach(filepath => {
                let isInFolder = false;
                Object.values(fileStructure.folders).forEach(arr => {
                    if (arr.includes(filepath)) isInFolder = true;
                });

                if (!isInFolder) {
                    const item = document.createElement('div');
                    item.className = `tree-item ${filepath === activeFile ? 'active' : ''}`;
                    item.onclick = () => openFile(filepath);
                    item.innerHTML = `
                        <span>📄 ${filepath}</span>
                        <span class="del-btn" onclick="deleteItem('${filepath}', false, event)">✖</span>
                    `;
                    tree.appendChild(item);
                }
            });
        }

        function renderTabs() {
            const tabsHeader = document.getElementById('tabsHeader');
            tabsHeader.innerHTML = '';
            Object.keys(fileStructure.files).forEach(filepath => {
                const tab = document.createElement('div');
                tab.className = `tab ${filepath === activeFile ? 'active' : ''}`;
                tab.onclick = () => openFile(filepath);
                tab.innerText = filepath.split('/').pop();
                tabsHeader.appendChild(tab);
            });
        }

        function runPreview() {
            let html = fileStructure.files['index.html'] ? fileStructure.files['index.html'].content : '';
            
            // CSS ve JS'leri içe aktarma
            Object.keys(fileStructure.files).forEach(path => {
                if (path.endsWith('.css')) {
                    html += `<style>${fileStructure.files[path].content}</style>`;
                }
                if (path.endsWith('.js') && path !== 'script.js') {
                    html += `<script>${fileStructure.files[path].content}<\/script>`;
                }
            });

            const frame = document.getElementById('preview-frame');
            const frameDoc = frame.contentDocument || frame.contentWindow.document;
            frameDoc.open();
            frameDoc.write(html);
            frameDoc.close();

            const fsFrame = document.getElementById('fs-preview-frame');
            const fsFrameDoc = fsFrame.contentDocument || fsFrame.contentWindow.document;
            fsFrameDoc.open();
            fsFrameDoc.write(html);
            fsFrameDoc.close();
        }

        function toggleFullScreen(show) {
            const modal = document.getElementById('fullscreen-modal');
            modal.style.display = show ? 'flex' : 'none';
        }

        function downloadProjectZip() {
            if (typeof JSZip === 'undefined') {
                alert("İndirme kütüphanesi yükleniyor, lütfen 2 saniye sonra tekrar deneyin!");
                return;
            }
            const zip = new JSZip();
            Object.keys(fileStructure.files).forEach(path => {
                zip.file(path, fileStructure.files[path].content);
            });
            zip.generateAsync({ type: "blob" }).then(function(content) {
                saveAs(content, "armut-pen-proje.zip");
            });
        }

        function updateRefSelect() {
            const select = document.getElementById('refSelect');
            select.innerHTML = '<option value="">📎 AI'ya Referans Dosya Bağla...</option>';
            Object.keys(fileStructure.files).forEach(filepath => {
                select.innerHTML += `<option value="${filepath}">${filepath}</option>`;
            });
        }

        function setReferenceFile(filepath) {
            if (!filepath) { clearReference(); return; }
            referenceFile = filepath;
            document.getElementById('refFileName').innerText = `📄 Referans: ${filepath}`;
            document.getElementById('refFileBox').style.display = 'flex';
        }

        function clearReference() {
            referenceFile = null;
            document.getElementById('refSelect').value = '';
            document.getElementById('refFileBox').style.display = 'none';
        }

        function addMessage(text, sender) {
            const chatHistory = document.getElementById('chatHistory');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerHTML = text;
            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const prompt = input.value.trim();
            const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();

            if (!prompt) return;
            if (!apiKey) { alert('Lütfen önce yukarıya Gemini API Key girip kaydedin!'); return; }

            addMessage(prompt, 'user');
            input.value = '';

            addMessage('Nambır AI düşünüyor...', 'ai');
            const loadingMsg = document.getElementById('chatHistory').lastChild;

            try {
                let context = `Sen "Nambır AI" kod asistanısın. Aktif dosya: ${activeFile}\n\n`;
                if (referenceFile && fileStructure.files[referenceFile]) {
                    context += `Kullanıcının REFERANS bağladığı dosya (${referenceFile}):\n\`\`\`\n${fileStructure.files[referenceFile].content}\n\`\`\`\n\n`;
                }
                context += `Aktif Dosya İçeriği:\n\`\`\`\n${editor ? editor.getValue() : ''}\n\`\`\`\n\nKullanıcı Sordusu: ${prompt}`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: context }] }] })
                });

                const data = await response.json();

                if (data.error) {
                    loadingMsg.innerText = `⚠️ Hata (${data.error.code}): ${data.error.message}`;
                    return;
                }

                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    loadingMsg.innerHTML = aiReply.replace(/\n/g, '<br>');
                } else {
                    loadingMsg.innerText = "Yanıt alınamadı.";
                }

            } catch (err) {
                loadingMsg.innerText = `⚠️ Bağlantı Hatası: ${err.message}`;
            }
        }
    </script>
</body>
</html>
