<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armut Pen v6.1 Studio</title>
    <!-- Dahili JSZip ve FileSaver Bağlantıları (Güvenli & Kilitlenmesiz) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #1e1e1e; color: #d4d4d4; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* HEADER */
        header { background-color: #252526; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3c3c3c; height: 45px; }
        .logo { font-weight: bold; font-size: 15px; color: #a6e22e; display: flex; align-items: center; gap: 8px; }
        .actions { display: flex; gap: 8px; align-items: center; }
        input[type="text"], input[type="password"], select { background-color: #3c3c3c; border: 1px solid #555; color: white; padding: 5px 8px; border-radius: 4px; font-size: 12px; outline: none; }
        button { background-color: #0e639c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; transition: background 0.2s; }
        button:hover { background-color: #1177bb; }
        button.secondary { background-color: #3c3c3c; }
        button.secondary:hover { background-color: #505050; }
        button.success { background-color: #28a745; }
        button.success:hover { background-color: #218838; }

        /* WORKSPACE */
        .workspace { display: flex; flex: 1; height: calc(100vh - 45px); }
        
        /* SIDEBAR (GEZGİN) */
        #sidebar { width: 230px; background-color: #252526; border-right: 1px solid #3c3c3c; display: flex; flex-direction: column; user-select: none; }
        .sidebar-header { padding: 10px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: #888; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .tree-actions { display: flex; gap: 4px; }
        .file-tree { flex: 1; overflow-y: auto; padding: 5px 0; }
        
        .tree-item { padding: 6px 12px; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; color: #cccccc; }
        .tree-item:hover { background-color: #2a2d2e; }
        .tree-item.active { background-color: #37373d; color: #fff; border-left: 3px solid #0e639c; }
        .tree-item.folder { font-weight: bold; color: #e8a838; }
        .tree-item .del-btn { display: none; color: #ff5555; font-size: 11px; font-weight: bold; padding: 2px 4px; }
        .tree-item:hover .del-btn { display: inline; }
        .tree-item .add-file-btn { display: none; color: #a6e22e; font-size: 11px; font-weight: bold; margin-right: 6px; }
        .tree-item.folder:hover .add-file-btn { display: inline; }
        .folder-children { padding-left: 15px; }

        /* EDITOR PANEL */
        #editor-panel { flex: 1.2; display: flex; flex-direction: column; border-right: 1px solid #3c3c3c; background-color: #1e1e1e; }
        .tabs { background-color: #2d2d2d; display: flex; overflow-x: auto; border-bottom: 1px solid #3c3c3c; }
        .tab { padding: 8px 14px; font-size: 12px; background: #2d2d2d; color: #969696; border-right: 1px solid #252526; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .tab.active { background: #1e1e1e; color: #fff; border-top: 2px solid #0e639c; }
        
        /* EDITOR TEXTAREA & LINE NUMBERS */
        .editor-wrapper { flex: 1; display: flex; background: #1e1e1e; overflow: hidden; position: relative; }
        .line-numbers { width: 40px; background-color: #1e1e1e; color: #858585; text-align: right; padding: 10px 8px; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; line-height: 1.5; border-right: 1px solid #333; user-select: none; }
        textarea#codeEditor { flex: 1; background: #1e1e1e; color: #d4d4d4; border: none; outline: none; padding: 10px; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; line-height: 1.5; resize: none; tab-size: 2; white-space: pre; overflow: auto; }

        /* PREVIEW PANEL */
        #preview-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #3c3c3c; background: #ffffff; }
        .panel-header { background-color: #2d2d2d; padding: 6px 12px; font-size: 12px; font-weight: bold; color: #aaa; border-bottom: 1px solid #3c3c3c; display: flex; justify-content: space-between; align-items: center; }
        iframe { flex: 1; width: 100%; height: 100%; border: none; background: #ffffff; }

        /* FULLSCREEN MODAL */
        #fullscreen-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 99999; flex-direction: column; }
        #fullscreen-modal.active { display: flex; }
        #fullscreen-modal .fs-header { background: #252526; padding: 10px 15px; display: flex; justify-content: space-between; color: white; align-items: center; }

        /* AI PANEL */
        #ai-panel { width: 320px; background-color: #252526; display: flex; flex-direction: column; }
        .chat-history { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 8px 12px; border-radius: 6px; font-size: 12px; max-width: 90%; line-height: 1.4; word-wrap: break-word; }
        .message.user { background-color: #0e639c; color: white; align-self: flex-end; }
        .message.ai { background-color: #333333; color: #d4d4d4; align-self: flex-start; border: 1px solid #444; }
        
        .chat-input-area { padding: 10px; background-color: #1e1e1e; border-top: 1px solid #3c3c3c; display: flex; flex-direction: column; gap: 8px; }
        .ref-file-box { font-size: 11px; color: #a6e22e; display: flex; align-items: center; justify-content: space-between; background: #252526; padding: 4px 8px; border-radius: 4px; display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            🍐 Armut Pen <span style="font-size: 10px; background: #3c3c3c; color: #a6e22e; padding: 2px 6px; border-radius: 4px;">v6.1 ZIP-Master</span>
        </div>
        <div class="actions">
            <input type="password" id="apiKeyInput" placeholder="Gemini API Key...">
            <button class="secondary" id="btnSaveKey">Key Kaydet</button>
            <button class="success" id="btnDownloadZip">📦 Tüm Projeyi İndir (.ZIP)</button>
            <button id="btnRefresh">🔄 Yenile</button>
        </div>
    </header>

    <div class="workspace">
        <!-- SIDEBAR -->
        <div id="sidebar">
            <div class="sidebar-header">
                <span>GEZGİN</span>
                <div class="tree-actions">
                    <button style="padding:2px 5px; font-size:10px;" id="btnAddFolder">+ Klasör</button>
                    <button style="padding:2px 5px; font-size:10px;" id="btnAddFile">+ Dosya</button>
                </div>
            </div>
            <div class="file-tree" id="fileTree"></div>
        </div>

        <!-- EDITOR PANEL -->
        <div id="editor-panel">
            <div class="tabs" id="tabsHeader"></div>
            <div class="editor-wrapper">
                <div class="line-numbers" id="lineNumbers">1</div>
                <textarea id="codeEditor" spellcheck="false"></textarea>
            </div>
        </div>

        <!-- PREVIEW PANEL -->
        <div id="preview-panel">
            <div class="panel-header">
                <span>Canlı Önizleme</span>
                <button class="secondary" style="font-size: 11px;" id="btnFullscreen">⛶ Tam Ekran Gör</button>
            </div>
            <iframe id="preview-frame"></iframe>
        </div>

        <!-- AI PANEL -->
        <div id="ai-panel">
            <div class="panel-header">🤖 Nambır AI Auto-Pilot</div>
            <div class="chat-history" id="chatHistory">
                <div class="message ai">
                    Selam kanka! <b>v6.1 ZIP-Master</b> hazır. Bütün klasör yapısını tek tıkla <b>.ZIP</b> olarak indirebilirsin! 🚀
                </div>
            </div>
            <div class="chat-input-area">
                <div id="refFileBox" class="ref-file-box">
                    <span id="refFileName">📄 Referans: Yok</span>
                    <span style="cursor:pointer; color:#ff5555;" id="btnClearRef">✖</span>
                </div>
                <select id="refSelect">
                    <option value="">📎 AI'ya Odak Dosya Bağla...</option>
                </select>
                <div style="display:flex; gap:6px;">
                    <input type="text" id="userInput" placeholder="Otonom AI'ya Talimat Ver..." style="flex:1;">
                    <button id="btnSendAi">Gönder</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FULLSCREEN MODAL -->
    <div id="fullscreen-modal">
        <div class="fs-header">
            <span>🌐 Canlı Tam Ekran Önizleme</span>
            <button class="secondary" id="btnCloseFs">❌ Kapat</button>
        </div>
        <iframe id="fs-preview-frame"></iframe>
    </div>

    <script>
        // --- SİSTEM DEĞİŞKENLERİ ---
        let fileStructure = {
            folders: {
                "src": ["src/style.css", "src/script.js"]
            },
            files: {
                "index.html": `<!DOCTYPE html>\n<html>\n<head>\n  <link rel="stylesheet" href="src/style.css">\n</head>\n<body>\n  <h1>🍐 Armut Pen v6.1 ZIP-Master!</h1>\n  <p>Tüm proje klasörleriyle beraber .ZIP formatında indirilebilir.</p>\n  <button onclick="selam()">Tıkla Kanka</button>\n  <script src="src/script.js"><\/script>\n</body>\n</html>`,
                "src/style.css": `body {\n  background: #111827;\n  color: #a6e22e;\n  font-family: sans-serif;\n  text-align: center;\n  padding-top: 50px;\n}\nbutton {\n  padding: 10px 20px;\n  background: #0e639c;\n  color: white;\n  border: none;\n  border-radius: 5px;\n  cursor: pointer;\n}`,
                "src/script.js": `function selam() {\n  alert(".ZIP İndirme Butonu Tamamen Aktif!");\n}`
            }
        };

        let activeFile = "index.html";
        let referenceFile = null;

        // --- DOM ELEMANLARI ---
        const codeEditor = document.getElementById('codeEditor');
        const lineNumbers = document.getElementById('lineNumbers');
        const fileTree = document.getElementById('fileTree');
        const tabsHeader = document.getElementById('tabsHeader');
        const refSelect = document.getElementById('refSelect');
        const apiKeyInput = document.getElementById('apiKeyInput');

        // --- SAYFA YÜKLENDİĞİNDE ÇALIŞACAK KISIM ---
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) apiKeyInput.value = savedKey;

            const savedStruct = localStorage.getItem('armut_v6_struct');
            if (savedStruct) {
                try { fileStructure = JSON.parse(savedStruct); } catch(e){}
            }

            document.getElementById('btnSaveKey').addEventListener('click', saveApiKey);
            document.getElementById('btnDownloadZip').addEventListener('click', downloadEntireProjectZip);
            document.getElementById('btnRefresh').addEventListener('click', runPreview);
            document.getElementById('btnAddFolder').addEventListener('click', createNewFolder);
            document.getElementById('btnAddFile').addEventListener('click', createNewFileRoot);
            document.getElementById('btnFullscreen').addEventListener('click', () => toggleFullscreen(true));
            document.getElementById('btnCloseFs').addEventListener('click', () => toggleFullscreen(false));
            document.getElementById('btnSendAi').addEventListener('click', sendMessage);
            document.getElementById('btnClearRef').addEventListener('click', clearReference);
            
            userInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendMessage(); });
            refSelect.addEventListener('change', (e) => setReferenceFile(e.target.value));

            codeEditor.addEventListener('input', () => {
                fileStructure.files[activeFile] = codeEditor.value;
                localStorage.setItem('armut_v6_struct', JSON.stringify(fileStructure));
                updateLineNumbers();
                runPreview();
            });

            codeEditor.addEventListener('scroll', () => {
                lineNumbers.scrollTop = codeEditor.scrollTop;
            });

            codeEditor.addEventListener('keydown', (e) => {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = codeEditor.selectionStart;
                    const end = codeEditor.selectionEnd;
                    codeEditor.value = codeEditor.value.substring(0, start) + "  " + codeEditor.value.substring(end);
                    codeEditor.selectionStart = codeEditor.selectionEnd = start + 2;
                }
            });

            openFile(activeFile);
            updateFileTree();
            updateRefSelect();
        });

        // --- .ZIP İNDİRME FONKSİYONU ---
        function downloadEntireProjectZip() {
            if (typeof JSZip === "undefined") {
                alert("JSZip kütüphanesi yüklenemedi. Lütfen sayfayı yenileyin.");
                return;
            }

            const zip = new JSZip();

            // Tüm klasörleri ve dosyaları ZIP içine ekle
            Object.keys(fileStructure.files).forEach(filepath => {
                zip.file(filepath, fileStructure.files[filepath]);
            });

            // ZIP dosyasını oluştur ve indir
            zip.generateAsync({ type: "blob" }).then(function(content) {
                saveAs(content, "armut-pen-projesi.zip");
            });
        }

        // --- EDİTÖR & DOSYA İŞLEMLERİ ---
        function updateLineNumbers() {
            const lines = codeEditor.value.split('\n').length;
            let linesStr = '';
            for (let i = 1; i <= lines; i++) linesStr += i + '<br>';
            lineNumbers.innerHTML = linesStr;
        }

        function openFile(filepath) {
            if (fileStructure.files[filepath] === undefined) return;
            activeFile = filepath;
            codeEditor.value = fileStructure.files[filepath];
            updateLineNumbers();
            renderTabs();
            updateFileTree();
            runPreview();
        }

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API Key Kaydedildi!');
            } else {
                alert('Lütfen geçerli bir API Key girin!');
            }
        }

        function createNewFolder() {
            const folderName = prompt("Yeni Klasör Adı:");
            if (!folderName) return;
            if (fileStructure.folders[folderName]) { alert("Bu klasör var!"); return; }
            fileStructure.folders[folderName] = [];
            saveAndRefresh();
        }

        function createNewFileRoot() {
            const fileName = prompt("Kök Dizine Dosya Adı (Örn: script.js):");
            if (!fileName) return;
            addFileToSystem(fileName);
        }

        function createNewFileInFolder(folderName, e) {
            if(e) e.stopPropagation();
            const fileName = prompt(`[${folderName}] Klasörüne Eklenecek Dosya Adı:`);
            if (!fileName) return;
            const fullPath = `${folderName}/${fileName}`;
            if (!fileStructure.folders[folderName]) fileStructure.folders[folderName] = [];
            fileStructure.folders[folderName].push(fullPath);
            addFileToSystem(fullPath);
        }

        function addFileToSystem(filepath) {
            if (fileStructure.files[filepath] !== undefined) return;
            fileStructure.files[filepath] = "";
            saveAndRefresh();
            openFile(filepath);
        }

        function deleteItem(path, isFolder, e) {
            if(e) e.stopPropagation();
            if (isFolder) {
                (fileStructure.folders[path] || []).forEach(f => delete fileStructure.files[f]);
                delete fileStructure.folders[path];
            } else {
                delete fileStructure.files[path];
                Object.keys(fileStructure.folders).forEach(fol => {
                    fileStructure.folders[fol] = fileStructure.folders[fol].filter(x => x !== path);
                });
            }
            const remaining = Object.keys(fileStructure.files);
            if (remaining.length > 0) openFile(remaining[0]);
            saveAndRefresh();
        }

        function saveAndRefresh() {
            localStorage.setItem('armut_v6_struct', JSON.stringify(fileStructure));
            updateFileTree();
            updateRefSelect();
            renderTabs();
            runPreview();
        }

        function updateFileTree() {
            fileTree.innerHTML = '';

            Object.keys(fileStructure.folders).forEach(folder => {
                const fDiv = document.createElement('div');
                fDiv.className = 'tree-item folder';
                fDiv.innerHTML = `
                    <span>📁 ${folder}</span>
                    <div>
                        <span class="add-file-btn" data-folder="${folder}">+ Dosya</span>
                        <span class="del-btn" data-del-folder="${folder}">✖</span>
                    </div>
                `;
                fileTree.appendChild(fDiv);

                const childBox = document.createElement('div');
                childBox.className = 'folder-children';
                (fileStructure.folders[folder] || []).forEach(cPath => {
                    const cDiv = document.createElement('div');
                    cDiv.className = `tree-item ${cPath === activeFile ? 'active' : ''}`;
                    cDiv.innerHTML = `
                        <span>📄 ${cPath.split('/').pop()}</span>
                        <span class="del-btn" data-del-file="${cPath}">✖</span>
                    `;
                    cDiv.addEventListener('click', () => openFile(cPath));
                    childBox.appendChild(cDiv);
                });
                fileTree.appendChild(childBox);
            });

            Object.keys(fileStructure.files).forEach(filepath => {
                let isInFolder = false;
                Object.values(fileStructure.folders).forEach(arr => {
                    if (arr.includes(filepath)) isInFolder = true;
                });

                if (!isInFolder) {
                    const item = document.createElement('div');
                    item.className = `tree-item ${filepath === activeFile ? 'active' : ''}`;
                    item.innerHTML = `
                        <span>📄 ${filepath}</span>
                        <span class="del-btn" data-del-file="${filepath}">✖</span>
                    `;
                    item.addEventListener('click', () => openFile(filepath));
                    fileTree.appendChild(item);
                }
            });

            document.querySelectorAll('[data-folder]').forEach(el => {
                el.onclick = (e) => createNewFileInFolder(el.getAttribute('data-folder'), e);
            });
            document.querySelectorAll('[data-del-folder]').forEach(el => {
                el.onclick = (e) => deleteItem(el.getAttribute('data-del-folder'), true, e);
            });
            document.querySelectorAll('[data-del-file]').forEach(el => {
                el.onclick = (e) => deleteItem(el.getAttribute('data-del-file'), false, e);
            });
        }

        function renderTabs() {
            tabsHeader.innerHTML = '';
            Object.keys(fileStructure.files).forEach(filepath => {
                const tab = document.createElement('div');
                tab.className = `tab ${filepath === activeFile ? 'active' : ''}`;
                tab.innerText = filepath.split('/').pop();
                tab.addEventListener('click', () => openFile(filepath));
                tabsHeader.appendChild(tab);
            });
        }

        function runPreview() {
            let html = fileStructure.files['index.html'] || '';
            
            Object.keys(fileStructure.files).forEach(path => {
                if (path.endsWith('.css')) {
                    html += `<style>${fileStructure.files[path]}</style>`;
                }
                if (path.endsWith('.js') && !path.includes('script.js')) {
                    html += `<script>${fileStructure.files[path]}<\/script>`;
                }
            });

            if(fileStructure.files['src/script.js']) {
                html += `<script>${fileStructure.files['src/script.js']}<\/script>`;
            }

            const frame = document.getElementById('preview-frame');
            const frameDoc = frame.contentDocument || frame.contentWindow.document;
            frameDoc.open();
            frameDoc.write(html);
            frameDoc.close();

            const fsFrame = document.getElementById('fs-preview-frame');
            const fsFrameDoc = fsFrame.contentDocument || fsFrame.contentWindow.document;
            fsFrameDoc.open();
            fsFrameDoc.write(html);
            fsFrameDoc.close();
        }

        function toggleFullscreen(show) {
            const modal = document.getElementById('fullscreen-modal');
            if (show) {
                modal.classList.add('active');
                runPreview();
            } else {
                modal.classList.remove('active');
            }
        }

        function updateRefSelect() {
            refSelect.innerHTML = '<option value="">📎 AI\'ya Odak Dosya Bağla...</option>';
            Object.keys(fileStructure.files).forEach(filepath => {
                refSelect.innerHTML += `<option value="${filepath}">${filepath}</option>`;
            });
        }

        function setReferenceFile(filepath) {
            if (!filepath) { clearReference(); return; }
            referenceFile = filepath;
            document.getElementById('refFileName').innerText = `📄 Referans: ${filepath}`;
            document.getElementById('refFileBox').style.display = 'flex';
        }

        function clearReference() {
            referenceFile = null;
            refSelect.value = '';
            document.getElementById('refFileBox').style.display = 'none';
        }

        function addMessage(text, sender) {
            const chatHistory = document.getElementById('chatHistory');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerHTML = text;
            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // --- AUTONOMOUS AI ENGINE ---
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const prompt = input.value.trim();
            const apiKey = localStorage.getItem('gemini_api_key') || apiKeyInput.value.trim();

            if (!prompt) return;
            if (!apiKey) { alert('Lütfen sol üst alana Gemini API Key girip kaydedin!'); return; }

            addMessage(prompt, 'user');
            input.value = '';

            addMessage('⚡️ Nambır AI Kod Düzenliyor...', 'ai');
            const loadingMsg = document.getElementById('chatHistory').lastChild;

            try {
                const systemPrompt = `
Sen "Nambır AI Auto-Pilot" otonom geliştirme asistanısın. KESİNLİKLE sohbet alanına kod yazmayacaksın.
Doğrudan projenin yapısını, dosyalarını ve kodlarını kontrol ediyorsun.

MEVCUT PROJE YAPISI:
${JSON.stringify(fileStructure, null, 2)}

AKTİF DOSYA: ${activeFile}
KULLANICI İSTEĞİ: "${prompt}"

SADECE AŞAĞIDAKİ JSON FORMATINDA YANIT VER:
{
  "summary": "Kısa Türkçe açıklama",
  "createFolders": ["yeni_klasor_adi"],
  "deleteItems": ["silinecek_yol"],
  "updateFiles": {
    "index.html": "tam kod..."
  }
}
                `;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: systemPrompt }] }] })
                });

                const data = await response.json();

                if (data.error) {
                    loadingMsg.innerText = `⚠️ Hata (${data.error.code}): ${data.error.message}`;
                    return;
                }

                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    let rawReply = data.candidates[0].content.parts[0].text;
                    rawReply = rawReply.replace(/```json/g, '').replace(/```/g, '').trim();
                    
                    try {
                        const aiAction = JSON.parse(rawReply);
                        
                        if (aiAction.createFolders && Array.isArray(aiAction.createFolders)) {
                            aiAction.createFolders.forEach(fol => {
                                if (!fileStructure.folders[fol]) fileStructure.folders[fol] = [];
                            });
                        }

                        if (aiAction.deleteItems && Array.isArray(aiAction.deleteItems)) {
                            aiAction.deleteItems.forEach(item => {
                                deleteItem(item, !!fileStructure.folders[item]);
                            });
                        }

                        if (aiAction.updateFiles) {
                            Object.keys(aiAction.updateFiles).forEach(filepath => {
                                fileStructure.files[filepath] = aiAction.updateFiles[filepath];
                                if (filepath.includes('/')) {
                                    const folName = filepath.split('/')[0];
                                    if (!fileStructure.folders[folName]) fileStructure.folders[folName] = [];
                                    if (!fileStructure.folders[folName].includes(filepath)) {
                                        fileStructure.folders[folName].push(filepath);
                                    }
                                }
                            });
                        }

                        saveAndRefresh();
                        if (aiAction.updateFiles && aiAction.updateFiles[activeFile] !== undefined) {
                            codeEditor.value = fileStructure.files[activeFile];
                            updateLineNumbers();
                        }

                        loadingMsg.innerHTML = `✅ <b>İşlem Tamamlandı:</b> ${aiAction.summary || 'Proje güncellendi.'}`;

                    } catch(jsonErr) {
                        loadingMsg.innerText = `⚠️ Yapay Zeka Format Hatası. Lütfen tekrar deneyin.`;
                    }

                } else {
                    loadingMsg.innerText = "Yanıt alınamadı.";
                }

            } catch (err) {
                loadingMsg.innerText = `⚠️ Bağlantı Hatası: ${err.message}`;
            }
        }
    </script>
</body>
</html>
