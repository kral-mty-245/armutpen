<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armut Pen v5.0 - Pro Studio</title>
    <!-- Monaco Editor CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <!-- JSZip & FileSaver (Klasör olarak indirmek için) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #d4d4d4; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { background-color: #252526; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3c3c3c; height: 45px; }
        .logo { font-weight: bold; font-size: 16px; color: #a6e22e; display: flex; align-items: center; gap: 8px; }
        .actions { display: flex; gap: 6px; align-items: center; }
        input[type="text"], input[type="password"], select { background-color: #3c3c3c; border: 1px solid #555; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; outline: none; }
        button { background-color: #0e639c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; transition: background 0.2s; }
        button:hover { background-color: #1177bb; }
        button.secondary { background-color: #3c3c3c; }
        button.secondary:hover { background-color: #505050; }
        button.success { background-color: #28a745; }
        button.success:hover { background-color: #218838; }

        .workspace { display: flex; flex: 1; height: calc(100vh - 45px); }
        
        /* Sol Dosya Ağacı (Sidebar) */
        #sidebar { width: 220px; background-color: #252526; border-right: 1px solid #3c3c3c; display: flex; flex-direction: column; }
        .sidebar-header { padding: 8px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: #888; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .file-tree { flex: 1; overflow-y: auto; padding: 5px 0; }
        .file-item { padding: 6px 12px; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; color: #cccccc; border-left: 2px solid transparent; }
        .file-item:hover { background-color: #2a2d2e; }
        .file-item.active { background-color: #37373d; color: #fff; border-left-color: #0e639c; }
        .file-item .del-btn { display: none; color: #ff5555; font-weight: bold; font-size: 11px; }
        .file-item:hover .del-btn { display: inline; }

        /* Editör Paneli */
        #editor-panel { flex: 1.2; display: flex; flex-direction: column; border-right: 1px solid #3c3c3c; }
        .tabs { background-color: #2d2d2d; display: flex; overflow-x: auto; border-bottom: 1px solid #3c3c3c; }
        .tab { padding: 6px 14px; font-size: 12px; background: #2d2d2d; color: #969696; border-right: 1px solid #252526; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .tab.active { background: #1e1e1e; color: #fff; border-top: 2px solid #0e639c; }
        #editor-container { flex: 1; height: 100%; }

        /* Önizleme Paneli */
        #preview-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #3c3c3c; background: white; position: relative; }
        .panel-header { background-color: #2d2d2d; padding: 6px 12px; font-size: 12px; font-weight: bold; color: #aaa; border-bottom: 1px solid #3c3c3c; display: flex; justify-content: space-between; align-items: center; }
        iframe { flex: 1; width: 100%; height: 100%; border: none; }

        /* Tam Ekran Önizleme Modal */
        #fullscreen-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; flex-direction: column; }
        #fullscreen-modal.active { display: flex; }
        #fullscreen-modal .fs-header { background: #252526; padding: 8px 15px; display: flex; justify-content: space-between; color: white; align-items: center; }

        /* AI Asistan Panel */
        #ai-panel { width: 320px; background-color: #252526; display: flex; flex-direction: column; }
        .chat-history { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 8px 12px; border-radius: 6px; font-size: 12px; max-width: 90%; line-height: 1.4; word-wrap: break-word; }
        .message.user { background-color: #0e639c; color: white; align-self: flex-end; }
        .message.ai { background-color: #333333; color: #d4d4d4; align-self: flex-start; border: 1px solid #444; }
        
        .chat-input-area { padding: 8px; background-color: #1e1e1e; border-top: 1px solid #3c3c3c; display: flex; flex-direction: column; gap: 6px; }
        .ref-file-box { font-size: 11px; color: #a6e22e; display: flex; align-items: center; justify-content: space-between; background: #252526; padding: 4px 8px; border-radius: 4px; display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            🍐 Armut Pen <span style="font-size: 10px; background: #3c3c3c; color: #a6e22e; padding: 2px 6px; border-radius: 4px;">v5.0 Studio</span>
        </div>
        <div class="actions">
            <input type="password" id="apiKeyInput" placeholder="Gemini API Key...">
            <button class="secondary" onclick="saveApiKey()">Key Kaydet</button>
            <button class="success" onclick="downloadProjectZip()">📦 Projeyi Cihaza İndir (.ZIP)</button>
            <button onclick="runPreview()">🔄 Yenile</button>
        </div>
    </header>

    <div class="workspace">
        <!-- SOL SIDEBAR: DOSYA AĞACI -->
        <div id="sidebar">
            <div class="sidebar-header">
                <span>GEZGİN (FILES)</span>
                <button style="padding:2px 6px; font-size:10px;" onclick="createNewFile()">+ Yeni Dosya</button>
            </div>
            <div class="file-tree" id="fileTree"></div>
        </div>

        <!-- ORTA PANEL: EDİTÖR -->
        <div id="editor-panel">
            <div class="tabs" id="tabsHeader"></div>
            <div id="editor-container"></div>
        </div>

        <!-- SAĞ PANEL: ÖNİZLEME -->
        <div id="preview-panel">
            <div class="panel-header" style="color: #ddd;">
                <span>Canlı Önizleme</span>
                <button class="secondary" style="font-size: 10px;" onclick="toggleFullScreen(true)">⛶ Tam Ekran Gör</button>
            </div>
            <iframe id="preview-frame"></iframe>
        </div>

        <!-- SAĞ PANEL: AI ASİSTAN -->
        <div id="ai-panel">
            <div class="panel-header">🤖 Nambır AI Studio</div>
            <div class="chat-history" id="chatHistory">
                <div class="message ai">
                    Selam kanka! <b>Nambır AI v5</b> hazır. İster kod sor, ister aşağıdan bir dosyayı **referans gösterip** onun üzerinden geliştirme yapalım! 🚀
                </div>
            </div>
            <div class="chat-input-area">
                <!-- Referans Dosya Seçici -->
                <div id="refFileBox" class="ref-file-box">
                    <span id="refFileName">📄 Referans: Yok</span>
                    <span style="cursor:pointer; color:#ff5555;" onclick="clearReference()">✖</span>
                </div>
                <div style="display:flex; gap:4px;">
                    <select id="refSelect" style="flex:1;" onchange="setReferenceFile(this.value)">
                        <option value="">📎 AI'ya Referans Dosya Bağla...</option>
                    </select>
                </div>
                <div style="display:flex; gap:4px;">
                    <input type="text" id="userInput" placeholder="Nambır AI'ya sor..." onkeydown="if(event.key==='Enter') sendMessage()">
                    <button onclick="sendMessage()">Gönder</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TAM EKRAN MODAL -->
    <div id="fullscreen-modal">
        <div class="fs-header">
            <span>🌐 Canlı Tam Ekran Modu</span>
            <button class="secondary" onclick="toggleFullScreen(false)">❌ Kapat</button>
        </div>
        <iframe id="fs-preview-frame" style="flex:1; width:100%; height:100%;"></iframe>
    </div>

    <script>
        // --- 15+ DİL DESTEĞİ VE DİL EŞLEŞTİRMELERİ ---
        const languageMap = {
            'html': 'html', 'css': 'css', 'js': 'javascript', 'json': 'json',
            'py': 'python', 'cpp': 'cpp', 'c': 'cpp', 'cs': 'csharp',
            'java': 'java', 'php': 'php', 'ts': 'typescript', 'sql': 'sql',
            'rb': 'ruby', 'go': 'go', 'md': 'markdown'
        };

        // Varsayılan Proje Dosyaları
        let files = {
            'index.html': {
                language: 'html',
                content: `<!DOCTYPE html>\n<html>\n<head>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1>🍐 Armut Pen v5 Studio!</h1>\n  <p>VS Code Gibi Çoklu Dosya & Dil Desteği Aktif.</p>\n  <button onclick="selamVer()">Tıkla</button>\n  <script src="script.js"><\/script>\n</body>\n</html>`
            },
            'style.css': {
                language: 'css',
                content: `body { background: #111827; color: #8bc34a; font-family: sans-serif; text-align: center; padding-top: 50px; }\nbutton { padding: 10px 20px; background: #0e639c; color: white; border: none; border-radius: 5px; cursor: pointer; }`
            },
            'script.js': {
                language: 'javascript',
                content: `function selamVer() {\n  alert("Armut Pen v5 Tam Gaz Çalışıyor Kanka!");\n}`
            },
            'app.py': {
                language: 'python',
                content: `# Python Dosyası Örneği\ndef main():\n    print("Merhaba Python!")\n\nif __name__ == "__main__":\n    main()`
            }
        };

        let activeFile = 'index.html';
        let referenceFile = null;
        let editor = null;

        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
            
            // Kayıtlı dosyalar varsa yükle
            const savedFiles = localStorage.getItem('armut_v5_files');
            if(savedFiles) files = JSON.parse(savedFiles);

            updateFileTree();
            updateRefSelect();
        };

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API Key kaydedildi!');
            }
        }

        // MONACO EDITOR KURULUMU
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: files[activeFile].content,
                language: files[activeFile].language,
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 13,
                minimap: { enabled: false }
            });

            editor.onDidChangeModelContent(() => {
                files[activeFile].content = editor.getValue();
                localStorage.setItem('armut_v5_files', JSON.stringify(files));
                runPreview();
            });

            renderTabs();
            runPreview();
        });

        // DOSYALARI AÇMA / DÖNÜŞTÜRME
        function openFile(filename) {
            if (!files[filename]) return;
            files[activeFile].content = editor.getValue(); // Mevcut olanı kaydet
            activeFile = filename;
            
            const ext = filename.split('.').pop().toLowerCase();
            const lang = languageMap[ext] || 'plaintext';
            files[filename].language = lang;

            monaco.editor.setModelLanguage(editor.getModel(), lang);
            editor.setValue(files[filename].content);

            renderTabs();
            updateFileTree();
        }

        function createNewFile() {
            const name = prompt("Yeni Dosya Adı ve Uzantısı (Örn: style.css, main.py, index.php):");
            if (!name) return;
            if (files[name]) { alert("Bu dosya zaten var!"); return; }

            const ext = name.split('.').pop().toLowerCase();
            const lang = languageMap[ext] || 'plaintext';

            files[name] = { language: lang, content: "" };
            openFile(name);
            updateRefSelect();
        }

        function deleteFile(filename, e) {
            e.stopPropagation();
            if (Object.keys(files).length <= 1) { alert("En az bir dosya kalmalı!"); return; }
            if (confirm(`${filename} dosyasını silmek istediğine emin misin?`)) {
                delete files[filename];
                if (activeFile === filename) activeFile = Object.keys(files)[0];
                openFile(activeFile);
                updateRefSelect();
            }
        }

        function updateFileTree() {
            const tree = document.getElementById('fileTree');
            tree.innerHTML = '';
            Object.keys(files).forEach(filename => {
                const item = document.createElement('div');
                item.className = `file-item ${filename === activeFile ? 'active' : ''}`;
                item.onclick = () => openFile(filename);
                item.innerHTML = `
                    <span>📄 ${filename}</span>
                    <span class="del-btn" onclick="deleteFile('${filename}', event)">✖</span>
                `;
                tree.appendChild(item);
            });
        }

        function renderTabs() {
            const tabsHeader = document.getElementById('tabsHeader');
            tabsHeader.innerHTML = '';
            Object.keys(files).forEach(filename => {
                const tab = document.createElement('div');
                tab.className = `tab ${filename === activeFile ? 'active' : ''}`;
                tab.onclick = () => openFile(filename);
                tab.innerText = filename;
                tabsHeader.appendChild(tab);
            });
        }

        // CANLI ÖNİZLEME (HTML + CSS + JS BİRLEŞTİRİCİ)
        function runPreview() {
            if (!editor) return;
            let html = files['index.html'] ? files['index.html'].content : '';
            let css = files['style.css'] ? files['style.css'].content : '';
            let js = files['script.js'] ? files['script.js'].content : '';

            // CSS ve JS dosyalarını HTML'in içine dinamik olarak gömüyoruz
            const fullCode = `
                ${html}
                <style>${css}</style>
                <script>${js}<\/script>
            `;

            const frame = document.getElementById('preview-frame');
            const frameDoc = frame.contentDocument || frame.contentWindow.document;
            frameDoc.open();
            frameDoc.write(fullCode);
            frameDoc.close();

            // Tam ekran frame'ini de güncelle
            const fsFrame = document.getElementById('fs-preview-frame');
            const fsFrameDoc = fsFrame.contentDocument || fsFrame.contentWindow.document;
            fsFrameDoc.open();
            fsFrameDoc.write(fullCode);
            fsFrameDoc.close();
        }

        // TAM EKRAN ÖNİZLEME
        function toggleFullScreen(show) {
            const modal = document.getElementById('fullscreen-modal');
            if (show) modal.classList.add('active');
            else modal.classList.remove('active');
        }

        // CİHAZA GERÇEK KLASÖR / ZIP OLARAK KAYDETME
        function downloadProjectZip() {
            const zip = new JSZip();
            Object.keys(files).forEach(filename => {
                zip.file(filename, files[filename].content);
            });
            zip.generateAsync({ type: "blob" }).then(function(content) {
                saveAs(content, "armut-pen-projesi.zip");
            });
        }

        // AI İÇİN REFERANS DOSYA SEÇİMİ
        function updateRefSelect() {
            const select = document.getElementById('refSelect');
            select.innerHTML = '<option value="">📎 AI'ya Referans Dosya Bağla...</option>';
            Object.keys(files).forEach(filename => {
                select.innerHTML += `<option value="${filename}">${filename}</option>`;
            });
        }

        function setReferenceFile(filename) {
            if (!filename) { clearReference(); return; }
            referenceFile = filename;
            document.getElementById('refFileName').innerText = `📄 Referans: ${filename}`;
            document.getElementById('refFileBox').style.display = 'flex';
        }

        function clearReference() {
            referenceFile = null;
            document.getElementById('refSelect').value = '';
            document.getElementById('refFileBox').style.display = 'none';
        }

        function addMessage(text, sender) {
            const chatHistory = document.getElementById('chatHistory');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerHTML = text;
            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // NAMBIR AI GÖNDERME FONKSİYONU (REFERANS DESTEKLİ)
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const prompt = input.value.trim();
            const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();

            if (!prompt) return;
            if (!apiKey) { alert('Lütfen Gemini API Key girip kaydedin!'); return; }

            addMessage(prompt, 'user');
            input.value = '';

            addMessage('Nambır AI düşünüyor...', 'ai');
            const loadingMsg = document.getElementById('chatHistory').lastChild;

            try {
                // Referans ekli mi kontrol et
                let contextPrompt = `Sen "Nambır AI" adında bir IDE kodlama asistanısın. Şu an aktif dosya: ${activeFile}\n\n`;
                
                if (referenceFile && files[referenceFile]) {
                    contextPrompt += `Kullanıcının sana REFERANS gösterdiği dosya (${referenceFile}):\n\`\`\`\n${files[referenceFile].content}\n\`\`\`\n\n`;
                }

                contextPrompt += `Mevcut Aktif Dosya İçeriği (${activeFile}):\n\`\`\`\n${editor.getValue()}\n\`\`\`\n\nKullanıcı İsteği: ${prompt}`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: contextPrompt }] }] })
                });

                const data = await response.json();

                if (data.error) {
                    loadingMsg.innerText = `⚠️ Hata: ${data.error.message}`;
                    return;
                }

                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    loadingMsg.innerHTML = aiReply.replace(/\n/g, '<br>');
                } else {
                    loadingMsg.innerText = "Yanıt alınamadı kanka.";
                }

            } catch (err) {
                loadingMsg.innerText = `⚠️ Bağlantı Hatası: ${err.message}`;
            }
        }
    </script>
</body>
</html>
