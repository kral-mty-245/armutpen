<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armut Pen v4.0 - Nambır AI</title>
    <!-- Monaco Editor CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #d4d4d4; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { background-color: #252526; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3c3c3c; height: 50px; }
        .logo { font-weight: bold; font-size: 18px; color: #a6e22e; display: flex; align-items: center; gap: 8px; }
        .actions { display: flex; gap: 8px; align-items: center; }
        input[type="text"], input[type="password"] { background-color: #3c3c3c; border: 1px solid #555; color: white; padding: 6px 10px; border-radius: 4px; font-size: 12px; outline: none; }
        button { background-color: #0e639c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; transition: background 0.2s; }
        button:hover { background-color: #1177bb; }
        button.secondary { background-color: #3c3c3c; }
        button.secondary:hover { background-color: #505050; }
        button.success { background-color: #28a745; }
        button.success:hover { background-color: #218838; }

        .workspace { display: flex; flex: 1; height: calc(100vh - 50px); }
        .panel { display: flex; flex-direction: column; height: 100%; }
        .panel-header { background-color: #2d2d2d; padding: 6px 12px; font-size: 12px; font-weight: bold; color: #aaa; border-bottom: 1px solid #3c3c3c; display: flex; justify-content: space-between; align-items: center; }

        #editor-panel { flex: 1.2; border-right: 1px solid #3c3c3c; }
        #editor-container { flex: 1; height: 100%; }

        #preview-panel { flex: 1; border-right: 1px solid #3c3c3c; background: white; }
        iframe { flex: 1; width: 100%; height: 100%; border: none; }

        #ai-panel { flex: 0.8; min-width: 320px; background-color: #252526; }
        .chat-history { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 12px; border-radius: 6px; font-size: 13px; max-width: 95%; line-height: 1.4; word-wrap: break-word; }
        .message.user { background-color: #0e639c; color: white; align-self: flex-end; }
        .message.ai { background-color: #333333; color: #d4d4d4; align-self: flex-start; border: 1px solid #444; width: 100%; }
        
        /* Özel Kod Kutusu Tasarımı */
        .code-box-container { margin-top: 8px; background-color: #1e1e1e; border: 1px solid #007acc; border-radius: 6px; overflow: hidden; }
        .code-box-header { background-color: #2d2d2d; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: bold; color: #007acc; border-bottom: 1px solid #333; }
        .code-box-actions { display: flex; gap: 6px; }
        .code-box-actions button { font-size: 10px; padding: 3px 8px; }
        .code-box-content { padding: 10px; font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; background-color: #141414; color: #9cdcfe; max-height: 250px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }

        .chat-input-area { padding: 10px; background-color: #1e1e1e; border-top: 1px solid #3c3c3c; display: flex; gap: 6px; }
        .chat-input-area input { flex: 1; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            🍐 Armut Pen <span style="font-size: 10px; background: #3c3c3c; color: #a6e22e; padding: 2px 6px; border-radius: 4px;">v4.0</span>
        </div>
        <div class="actions">
            <input type="password" id="apiKeyInput" placeholder="Gemini API Key Girin...">
            <button class="secondary" onclick="saveApiKey()">Key Kaydet</button>
            <button class="secondary" onclick="saveToLocalStorage()">Kaydet</button>
            <button class="success" onclick="downloadCode()">📥 İndir</button>
            <button onclick="runPreview()">🔄 Yenile</button>
        </div>
    </header>

    <div class="workspace">
        <div class="panel" id="editor-panel">
            <div class="panel-header">Kod Alanı</div>
            <div id="editor-container"></div>
        </div>

        <div class="panel" id="preview-panel">
            <div class="panel-header" style="color: #333;">Canlı Önizleme</div>
            <iframe id="preview-frame"></iframe>
        </div>

        <div class="panel" id="ai-panel">
            <div class="panel-header">🤖 Nambır AI Asistanı</div>
            <div class="chat-history" id="chatHistory">
                <div class="message ai">
                    Selam kanka! Ben <b>Nambır AI</b>. Artık ürettiğim kodlar özel kutucukta geleceksin; tek tıkla <b>Kopyalayabilir</b> veya <b>Kullan</b> diyerek direkt sol panele aktarabilirsin! 🚀
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Nambır AI'ya bir şey sor..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">Gönder</button>
            </div>
        </div>
    </div>

    <script>
        let editor = null;
        let codeBlocksData = {}; // Üretilen kod bloklarını saklama hafızası

        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        };

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API Key hafızaya kaydedildi kanka!');
            } else {
                alert('Lütfen geçerli bir API Key girin.');
            }
        }

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            const defaultCode = `<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #111827; color: #f3f4f6; text-align: center; padding-top: 80px; font-family: system-ui, sans-serif; }
        h1 { font-size: 3rem; color: #8bc34a; margin-bottom: 10px; }
        p { color: #9ca3af; font-size: 1.2rem; }
        .card { background: #1f2937; padding: 20px; border-radius: 12px; display: inline-block; margin-top: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <h1>🍐 Armut Pen v4 Çalışıyor!</h1>
    <p>Sol taraftaki kodları değiştir, anında burada canlı gör.</p>
    <div class="card">🚀 İstediğin HTML/CSS/JS kodunu deneyebilirsin.</div>
</body>
</html>`;

            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: defaultCode,
                language: 'html',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                minimap: { enabled: false }
            });

            editor.onDidChangeModelContent(() => { runPreview(); });
            runPreview();
        });

        function runPreview() {
            if (!editor) return;
            const code = editor.getValue();
            const frame = document.getElementById('preview-frame');
            const frameDoc = frame.contentDocument || frame.contentWindow.document;
            frameDoc.open();
            frameDoc.write(code);
            frameDoc.close();
        }

        function saveToLocalStorage() {
            if (!editor) return;
            const code = editor.getValue();
            localStorage.setItem('armutpen_code_v4', code);
            alert('Kodlar kaydedildi!');
        }

        function downloadCode() {
            if (!editor) return;
            const code = editor.getValue();
            const blob = new Blob([code], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'armutpen-proje.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        function addMessage(text, sender) {
            const chatHistory = document.getElementById('chatHistory');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerHTML = text;
            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // Kopyalama Butonu Fonksiyonu
        function copyCodeBlock(id) {
            const rawCode = codeBlocksData[id];
            if (rawCode) {
                navigator.clipboard.writeText(rawCode).then(() => {
                    alert('Kod panoya kopyalandı! 📋');
                });
            }
        }

        // KODU DİREKT MONACO EDITOR'E AKTARAN "KULLAN" BUTONU
        function applyCodeBlock(id) {
            const rawCode = codeBlocksData[id];
            if (rawCode && editor) {
                editor.setValue(rawCode);
                runPreview();
                alert('Kod otomatik olarak editöre yüklendi! 🚀');
            }
        }

        // Güvenli Metin Escape İşlemi (HTML etiketlerinin kaybolmasını önler)
        function escapeHTML(str) {
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        // Yanıt İçindeki Kod Bloklarını Özel Kutucuğa Çeviren İşlemci
        function formatAiResponse(text) {
            const codeBlockRegex = /```(?:html|css|js|javascript)?\s*([\s\S]*?)```/g;
            let match;
            let formattedText = text;

            while ((match = codeBlockRegex.exec(text)) !== null) {
                const rawCode = match[1].trim();
                const blockId = 'code_block_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
                codeBlocksData[blockId] = rawCode;

                const codeBoxHTML = `
                <div class="code-box-container">
                    <div class="code-box-header">
                        <span>💻 HTML / KOD BLOĞU</span>
                        <div class="code-box-actions">
                            <button onclick="copyCodeBlock('${blockId}')">📋 Kopyala</button>
                            <button class="success" onclick="applyCodeBlock('${blockId}')">⚡ Kullan</button>
                        </div>
                    </div>
                    <div class="code-box-content">${escapeHTML(rawCode)}</div>
                </div>`;

                formattedText = formattedText.replace(match[0], codeBoxHTML);
            }

            return formattedText.replace(/\n/g, '<br>');
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const prompt = input.value.trim();
            const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();

            if (!prompt) return;
            if (!apiKey) {
                alert('Lütfen önce yukarıdaki alana Gemini API Key girip Key Kaydet butonuna basın!');
                return;
            }

            addMessage(escapeHTML(prompt), 'user');
            input.value = '';

            addMessage('Nambır AI düşünüyor...', 'ai');
            const loadingMsg = document.getElementById('chatHistory').lastChild;

            try {
                const currentCode = editor ? editor.getValue() : "";

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Sen "Nambır AI" adında bir kodlama asistanısın. Kod verdiğinde her zaman \`\`\`html ... \`\`\` markdown bloğu içinde ver.\n\nMevcut Kod:\n${currentCode}\n\nKullanıcı İsteği: ${prompt}`
                            }]
                        }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    loadingMsg.innerText = `⚠️ Hata (${data.error.code}): ${data.error.message}`;
                    return;
                }

                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    loadingMsg.innerHTML = formatAiResponse(aiReply);
                } else {
                    loadingMsg.innerText = "Yanıt alınamadı, lütfen tekrar dene kanka.";
                }

            } catch (err) {
                loadingMsg.innerText = `⚠️ Bağlantı Hatası: ${err.message}`;
            }
        }
    </script>
</body>
</html>
