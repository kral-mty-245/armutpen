server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # GitHub integration is intentionally disabled (see GITHUB_OAUTH.md).
    location /api/github {
        default_type application/json;
        return 410 '{"error":"GitHub entegrasyonu devre dışı bırakıldı.","code":"GITHUB_INTEGRATION_DISABLED"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
